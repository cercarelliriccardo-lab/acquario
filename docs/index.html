<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Acquario">
<link rel="apple-touch-icon" href="icona.png">
<title>Acquario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --accento:#2FBF9F;
  --accento-rgb:47,191,159;
  --vetro:linear-gradient(165deg,rgba(47,191,159,.13),rgba(4,12,14,.34));
  --bordo:rgba(47,191,159,.28);
  --chiaro:#EDF8F6;
  --tenue:rgba(240,250,250,.62);
  --allarme:#FF7A72;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:#0b1418;
  color:var(--chiaro);
  font:400 16px/1.45 'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{display:none}

/* le due tele: la vasca sta sotto tutto, l'erba sopra tutto */
#dietro,#davanti{position:fixed;inset:0;width:100%;height:100%;display:block}
#dietro{z-index:0;touch-action:manipulation}
#davanti{z-index:2;pointer-events:none}

#foglio{
  position:relative;z-index:1;height:100%;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:16px;
  padding:calc(22px + env(safe-area-inset-top)) 20px calc(120px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;
}

/* testata */
.testa{display:flex;align-items:center;justify-content:space-between;gap:12px}
.testa h1{margin:0;font:700 25px/1 'Outfit',sans-serif;letter-spacing:.16em;color:#fff}
#pillola{
  padding:9px 16px;border-radius:999px;cursor:default;
  font:600 12px/1 'Outfit',sans-serif;letter-spacing:.1em;
  border:1px solid rgba(47,191,159,.5);background:rgba(47,191,159,.12);color:var(--accento);
  transition:color .3s,border-color .3s,background .3s;
}
#pillola.morta{border-color:rgba(255,122,114,.5);background:rgba(255,122,114,.12);color:var(--allarme)}

/* la finestra sulla vasca: spazio vuoto, si vede la tela sotto */
.finestra{flex:none;height:210px;display:flex;align-items:flex-end;padding-bottom:4px}
.modo-ora{display:flex;align-items:center;gap:9px}
.pallino{width:9px;height:9px;border-radius:50%;background:var(--accento);box-shadow:0 0 12px var(--accento);transition:background .5s,box-shadow .5s}
.modo-nome{font:600 13px/1 'Outfit',sans-serif;letter-spacing:.2em;color:#fff}

/* pannelli di vetro */
.vetro{
  display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:18px;
  background:var(--vetro);border:1px solid var(--bordo);
  backdrop-filter:blur(12px) saturate(130%);
  -webkit-backdrop-filter:blur(12px) saturate(130%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
  transition:background .5s,border-color .5s;
}
.titolo{font:600 11px/1 'Outfit',sans-serif;letter-spacing:.16em;color:rgba(240,250,250,.8)}
.numero{font:400 30px/1 'DM Mono','SF Mono',Consolas,monospace;color:#fff}
.numero small{font-size:15px;color:rgba(240,250,250,.65)}
.nota{font:400 11px/1.35 'Outfit',sans-serif;color:var(--tenue)}
.due{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.due .vetro{gap:12px}

/* barra della temperatura: e' una misura, non un comando - niente manopola */
.barra{position:relative;height:5px;border-radius:999px;background:rgba(255,255,255,.14);margin:2px 0}
.fascia{position:absolute;top:-1px;bottom:-1px;border-radius:999px;background:rgba(255,255,255,.16)}
.spillo{position:absolute;top:50%;width:11px;height:11px;margin-top:-5.5px;margin-left:-5.5px;border-radius:50%;
  background:#bcd4d4;box-shadow:0 2px 6px rgba(0,0,0,.45);transition:left .6s cubic-bezier(.4,0,.2,1),background .4s}

/* interruttore del filtro */
.leva{width:50px;height:28px;border-radius:999px;border:none;cursor:pointer;padding:2px;
  display:flex;justify-content:flex-start;background:rgba(255,255,255,.16);transition:background .25s,justify-content .25s}
.leva.on{justify-content:flex-end;background:var(--accento)}
.leva span{width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* i cinque modi */
.modi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.modi button{
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 6px;
  border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);
  color:rgba(240,250,250,.85);font:500 14px/1 'Outfit',sans-serif;cursor:pointer;
  transition:background .2s,border-color .2s,color .2s,transform .08s;
}
.modi button:active{transform:scale(.96)}
.goccia{width:26px;height:26px;border-radius:50%;transition:box-shadow .3s}

/* cursore dell'intensita' */
.riga{display:flex;align-items:center;justify-content:space-between;gap:12px}
.riga .che{font:400 13px/1.3 'Outfit',sans-serif;color:rgba(240,250,250,.75)}
.riga .val{font:400 13px/1 'DM Mono',monospace;color:var(--accento)}
.pista{height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.pista>div{position:relative;width:100%;height:5px;border-radius:999px;background:rgba(255,255,255,.14)}
.riempi{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accento)}
.manopola{position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;margin-left:-8px;border-radius:50%;
  background:#bcd4d4;box-shadow:0 2px 6px rgba(0,0,0,.4)}

/* comandi a riga intera */
.comando{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;
  border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);
  cursor:pointer;text-align:left;font-family:inherit;transition:background .25s,border-color .25s;
}
.comando .nome{font:400 16px/1.2 'Outfit',sans-serif;color:rgba(240,250,250,.8)}
.comando .valore{font:400 13px/1 'DM Mono',monospace;color:rgba(240,250,250,.55)}
.comando.acceso{background:rgba(var(--accento-rgb),.1);border-color:rgba(var(--accento-rgb),.35)}
.comando.acceso .valore{color:var(--accento)}
button[disabled]{opacity:.45;cursor:default}

/* manutenzione */
.lavoro{display:flex;align-items:center;gap:12px}
.lavoro .che{flex:1;font:400 15px/1.2 'Outfit',sans-serif;color:rgba(240,250,250,.82)}
.lavoro .quando{font:400 12px/1 'DM Mono',monospace;color:rgba(240,250,250,.55);white-space:nowrap}
.lavoro .quando.ora{color:#FFA06B}
.lavoro button{
  padding:8px 14px;border-radius:11px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);color:rgba(240,250,250,.85);
  font:500 12.5px/1 'Outfit',sans-serif;letter-spacing:.05em;cursor:pointer;
}
.lavoro button:active{transform:scale(.96)}

/* calendario */
.voce{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.07)}
.voce:first-of-type{border-top:0;padding-top:2px}
.voce .giorno{width:112px;flex:none;font:400 12px/1.3 'DM Mono',monospace;color:rgba(240,250,250,.5)}
.voce .cosa{flex:1;font:400 14px/1.3 'Outfit',sans-serif;color:rgba(240,250,250,.85)}
.voce .misura{font:400 13px/1 'DM Mono',monospace;color:var(--accento)}
.vuoto{font:400 13px/1.4 'Outfit',sans-serif;color:rgba(240,250,250,.45)}

/* giornata */
.tappa{display:flex;align-items:center;gap:12px}
.tappa .bollo{width:8px;height:8px;flex:none;border-radius:50%}
.tappa .nome{flex:1;font:400 14px/1.3 'Outfit',sans-serif;color:rgba(240,250,250,.55);transition:color .4s}
.tappa.adesso .nome{color:rgba(240,250,250,.95)}
.tappa .quando{font:400 12px/1 'DM Mono',monospace;color:rgba(240,250,250,.6)}
/* L'orario si tocca. Niente scritta "tocca per cambiare": lo dice il segno
   tratteggiato sotto, che e' il modo in cui un testo dice "sono modificabile". */
.ora-tappa{
  -webkit-appearance:none;appearance:none;background:transparent;border:0;
  border-bottom:1px dashed rgba(240,250,250,.3);border-radius:0;
  padding:3px 0;margin:0;min-width:58px;text-align:right;
  font:400 13px/1 'DM Mono','SF Mono',Consolas,monospace;color:rgba(240,250,250,.85);
  color-scheme:dark;cursor:pointer;
}
.ora-tappa:focus{outline:none;border-bottom-color:var(--accento);color:#fff}
.ora-tappa::-webkit-calendar-picker-indicator{display:none}
.ora-tappa:disabled{opacity:.4;border-bottom-color:transparent}
.ripristina{align-self:flex-end;background:none;border:0;padding:4px 0;cursor:pointer;
  font:400 11px/1 'Outfit',sans-serif;letter-spacing:.06em;color:rgba(240,250,250,.4)}

/* l'attributo hidden deve vincere anche sui pannelli, che hanno display:flex */
[hidden]{display:none!important}
.campo{
  width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.25);color:#fff;font:400 16px/1.2 'Outfit',sans-serif;
}
.campo:focus{outline:none;border-color:var(--accento)}

footer{text-align:center;font:400 11px/1.4 'Outfit',sans-serif;color:rgba(240,250,250,.4);letter-spacing:.04em}
</style>
</head>
<body>

<canvas id="dietro"></canvas>

<div id="foglio">

  <div class="testa">
    <h1>ACQUARIO</h1>
    <div id="pillola">COLLEGAMENTO</div>
  </div>

  <div class="vetro" id="accesso" hidden>
    <span class="titolo">DA FUORI CASA</span>
    <span class="nota" id="notaAccesso">Password dell'utenza telefono del ponte. La chiede una volta sola.</span>
    <input type="text" autocomplete="username" value="telefono" hidden>
    <input type="password" class="campo" id="pwdPonte" autocomplete="current-password" placeholder="password">
    <button class="comando" id="tastoAccesso"><span class="nome">Collega</span><span class="valore">&rarr;</span></button>
  </div>

  <div class="finestra">
    <div class="modo-ora">
      <span class="pallino" id="pallino"></span>
      <span class="modo-nome" id="modoNome"></span>
    </div>
  </div>

  <div class="due">
    <div class="vetro">
      <span class="titolo">TEMPERATURA</span>
      <span class="numero"><span id="gradi">&mdash;&mdash;</span><small> &deg;C</small></span>
      <div class="barra">
        <div class="fascia" id="fascia"></div>
        <div class="spillo" id="spillo"></div>
      </div>
      <span class="nota" id="notaTemp">&nbsp;</span>
    </div>

    <div class="vetro">
      <span class="titolo">FILTRO</span>
      <span class="numero" id="valFiltro">&mdash;&mdash;</span>
      <button class="leva" id="levaFiltro" disabled><span></span></button>
      <span class="nota">canale 1 del rel&egrave;</span>
    </div>
  </div>

  <div class="vetro">
    <span class="titolo">LUCE</span>
    <div class="modi" id="modi"></div>
    <div class="riga">
      <span class="che">Intensit&agrave;</span>
      <span class="val" id="valIntensita">&mdash;</span>
    </div>
    <div class="pista" id="pista">
      <div>
        <div class="riempi" id="riempi" style="width:0%"></div>
        <div class="manopola" id="manopola" style="left:0%"></div>
      </div>
    </div>
    <button class="comando" id="tastoAuto" disabled>
      <span class="nome">Luce automatica</span>
      <span class="valore" id="valAuto">&mdash;&mdash;</span>
    </button>
  </div>

  <div class="vetro">
    <span class="titolo">MANUTENZIONE</span>
    <div class="lavoro">
      <span class="che">Cambio acqua</span>
      <span class="quando" id="quandoAcqua">&mdash;&mdash;</span>
      <button data-fatto="acqua">fatto</button>
    </div>
    <div class="lavoro">
      <span class="che">Filtro</span>
      <span class="quando" id="quandoFiltro">&mdash;&mdash;</span>
      <button data-fatto="filtro">fatto</button>
    </div>
  </div>

  <div class="vetro" style="gap:10px">
    <span class="titolo">CALENDARIO</span>
    <div id="calendario"><span class="vuoto">&nbsp;</span></div>
  </div>

  <div class="vetro" style="gap:10px">
    <span class="titolo">GIORNATA</span>
    <div id="giornata"></div>
    <button class="ripristina" id="ripristinaGiornata">orari predefiniti</button>
  </div>

  <footer id="pie">&nbsp;</footer>
</div>

<canvas id="davanti"></canvas>

<script>
"use strict";

/* ===========================================================================
   I MODI - tabella e colori del progetto grafico di ric.
   "luce" da 0 a 1 dice quanto quel modo illumina: e' il numero che scurisce
   piante e ghiaia di notte, non un valore decorativo.
   =========================================================================== */
var MODI = {
  alba:     { nome:'Alba',     bollo:'#E8A34D', accento:'#E8A34D', acqua:['#9c6440','#7d4530','#3a2118'], luce:0.50 },
  giorno:   { nome:'Giorno',   bollo:'#EDF8F6', accento:'#2FBF9F', acqua:['#54969b','#347a76','#17403a'], luce:1.00 },
  tramonto: { nome:'Tramonto', bollo:'#D9542F', accento:'#D9542F', acqua:['#ab5c3e','#8a3f2f','#43211b'], luce:0.55 },
  luna:     { nome:'Luna',     bollo:'#6A9BFF', accento:'#6A9BFF', acqua:['#1f4869','#12304c','#07131f'], luce:0.26 },
  spento:   { nome:'Spento',   bollo:'#3E5055', accento:'#8AA0A5', acqua:['#162126','#0e181b','#060a0c'], luce:0.10 }
};
var ORDINE = ['alba','giorno','tramonto','luna','spento'];

function caso(i){ var x = Math.sin(i*127.1+3.7)*43758.5453; return x-Math.floor(x); }
function fra(a,b,t){ return a+(b-a)*t; }
/* Spegne un colore verso il grigio quando cala la luce: di notte il verde
   delle piante non e' verde, e' una sagoma. */
function smorza(c,k){
  var g=(c[0]*0.35+c[1]*0.5+c[2]*0.15)*0.55;
  return [Math.round(fra(g,c[0],k)),Math.round(fra(g,c[1],k)),Math.round(fra(g,c[2],k))];
}
function rgba(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function daEsa(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }

/* ===========================================================================
   STATO
   =========================================================================== */
var S=null, modo='giorno', viva=false, ultimoContatto=0, inAttesa=false;

/* ===========================================================================
   IL PONTE - la stessa pagina, da fuori casa

   Questa pagina vive in due posti: dentro la centralina (acquario.local) e su
   GitHub. Da dove e' stata aperta decide come parla:
     - da acquario.local chiede alla centralina direttamente, come sempre;
     - da GitHub, cioe' da fuori casa, passa dal server MQTT.
   Un solo codice, quindi nessuna seconda app da tenere allineata alla prima.

   Nessuna password e' scritta qui dentro: la pagina su GitHub la puo' leggere
   chiunque. La password dell'utenza "telefono" la inserisce ric una volta, e
   resta solo sul suo telefono.
   =========================================================================== */
var REMOTO = !/^(acquario\.local|localhost|127\.|192\.168\.|10\.)/.test(location.hostname);
var PONTE = {
  indirizzo: 'wss://179d9e08063b41ec85094c891d290f78.s1.eu.hivemq.cloud:8884/mqtt',
  utente: 'telefono',
  stato: 'acquario/stato', storico: 'acquario/storico', comandi: 'acquario/comandi',
  esito: 'acquario/esito', online: 'acquario/online'
};
var cliente=null, ponteOnline=false, CHIAVE_PASSWORD='acquario-ponte';

function leggiPassword(){ try{ return localStorage.getItem(CHIAVE_PASSWORD)||''; }catch(e){ return ''; } }
function salvaPassword(v){ try{ if(v) localStorage.setItem(CHIAVE_PASSWORD,v); else localStorage.removeItem(CHIAVE_PASSWORD); }catch(e){} }

function mostraAccesso(testo){
  document.getElementById('accesso').hidden=false;
  if(testo) document.getElementById('notaAccesso').textContent=testo;
}

/* La libreria MQTT si scarica solo fuori casa: la copia dentro la centralina
   non ne ha bisogno, e sarebbero 100 KB che la scheda non puo' permettersi. */
function caricaMqtt(poi){
  if(window.mqtt) return poi();
  var sc=document.createElement('script');
  sc.src='https://cdn.jsdelivr.net/npm/mqtt@5.10.3/dist/mqtt.min.js';
  sc.onload=poi;
  sc.onerror=function(){ segnala('non riesco a caricare il collegamento al ponte'); };
  document.head.appendChild(sc);
}

/* Viva, da fuori casa, vuol dire tre cose insieme: il telefono e' collegato al
   server, la centralina risulta collegata, e l'ultimo stato ha meno di 45
   secondi. Senza l'ultima, un telefono che si collega mentre la centralina e'
   spenta vedrebbe l'ultimo stato memorizzato - magari di ieri - come se fosse
   di adesso. */
function aggiornaVita(){
  var fresco = ultimoContatto>0 && (Date.now()-ultimoContatto) < 45000;
  var prima = viva;
  viva = !!(cliente && cliente.connected && ponteOnline && fresco);
  if(prima!==viva) dipingi();
}

function collegaPonte(){
  var pwd=leggiPassword();
  if(!pwd){ mostraAccesso(); return; }
  document.getElementById('accesso').hidden=true;
  caricaMqtt(function(){
    if(cliente){ try{ cliente.end(true); }catch(e){} }
    cliente=mqtt.connect(PONTE.indirizzo,{
      username:PONTE.utente, password:pwd,
      clientId:'telefono-'+Math.random().toString(16).slice(2,10),
      clean:true, reconnectPeriod:5000, connectTimeout:10000
    });
    cliente.on('connect',function(){
      cliente.subscribe([PONTE.stato,PONTE.storico,PONTE.online,PONTE.esito],{qos:1});
    });
    cliente.on('message',function(argomento,messaggio){
      var t=messaggio.toString();
      if(argomento===PONTE.online){ ponteOnline=(t==='1'); aggiornaVita(); return; }
      if(argomento===PONTE.esito){ segnala(t); if(t.indexOf('orari')>=0) rimettiOrari(); return; }
      try{
        var d=JSON.parse(t);
        if(argomento===PONTE.stato){
          S=d; modo=d.modo; if(!trascino) intensita=d.intensita;
          ultimoContatto=(d.aggiornato||0)*1000;
          aggiornaVita(); dipingi();
        }else if(argomento===PONTE.storico){
          eventi=d.eventi||[]; dipingiCalendario();
        }
      }catch(e){}
    });
    cliente.on('error',function(err){
      var codice=err&&err.code, testo=String((err&&err.message)||'');
      /* 4 e 5: nome o password non accettati. Si dimentica la password salvata,
         altrimenti la pagina ritenterebbe all'infinito con quella sbagliata. */
      if(codice===4||codice===5||codice===134||codice===135||/not authori[sz]ed|bad user/i.test(testo)){
        salvaPassword('');
        try{ cliente.end(true); }catch(e){}
        cliente=null;
        mostraAccesso('Password non accettata. Riprova.');
      }
    });
    cliente.on('close',function(){ aggiornaVita(); });
  });
}

document.getElementById('tastoAccesso').onclick=function(){
  var campo=document.getElementById('pwdPonte');
  if(!campo.value) return;
  salvaPassword(campo.value);
  campo.value='';
  collegaPonte();
};
var intensita=100, trascino=false;
var avviso='', scadenzaAvviso=0;

function segnala(t){ avviso=t; scadenzaAvviso=Date.now()+5000; orologio(); }

var onde=[], bolle=[];

/* ===========================================================================
   LE DUE TELE
   =========================================================================== */
var cD=document.getElementById('dietro'), ctD=cD.getContext('2d');
var cF=document.getElementById('davanti'), ctF=cF.getContext('2d');
var L=0, A=0;

function misura(){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var l=window.innerWidth, a=window.innerHeight;
  [cD,cF].forEach(function(cv){
    if(cv.width!==Math.round(l*dpr)||cv.height!==Math.round(a*dpr)){
      cv.width=Math.round(l*dpr); cv.height=Math.round(a*dpr);
    }
    cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
  });
  L=l; A=a;
}

var t0=null, precedente=null;

function fotogramma(ts){
  requestAnimationFrame(fotogramma);
  if(t0===null) t0=ts;
  var t=(ts-t0)/1000;
  /* Il tempo trascorso non puo' essere negativo. Se l'orologio dei fotogrammi
     torna indietro anche una volta sola - un fotogramma disegnato fuori ordine,
     la pagina che si risveglia dal telefono in tasca - senza questo limite
     l'onda del tocco si restringe al contrario fino a un raggio negativo, e
     disegnare un cerchio col raggio negativo e' un errore che ferma
     l'animazione. Trovato provando la pagina col motore di Safari. */
  var dt=Math.max(0,Math.min(0.05,(ts-(precedente===null?ts:precedente))/1000));
  precedente=ts;

  /* la misura si ricontrolla a ogni giro: se al primo istante la pagina non e'
     impaginata la tela vale zero, e senza questo resterebbe nera per sempre */
  if(window.innerWidth!==L||window.innerHeight!==A) misura();
  if(!L||!A) return;

  var m = MODI[modo]||MODI.giorno;
  var lucek = Math.max(0.08, m.luce*(0.4+0.6*intensita/100));
  disegnaDietro(t,dt,m,lucek);
  disegnaDavanti(t,m,lucek);
}

function disegnaDietro(t,dt,m,lucek){
  var ct=ctD, fondo=A-58;
  ct.clearRect(0,0,L,A);

  var g=ct.createLinearGradient(0,0,0,A);
  g.addColorStop(0,m.acqua[0]); g.addColorStop(0.52,m.acqua[1]); g.addColorStop(1,m.acqua[2]);
  ct.fillStyle=g; ct.fillRect(0,0,L,A);

  /* righe di luce sul pelo dell'acqua */
  ct.save();
  ct.strokeStyle='rgba(255,255,255,'+(0.05+0.09*lucek)+')';
  ct.lineWidth=2;
  for(var i=0;i<9;i++){
    ct.beginPath();
    for(var x=0;x<=L;x+=14){
      var y=30+i*26+Math.sin(x*0.02+t*(0.5+i*0.06)+i)*7;
      x===0?ct.moveTo(x,y):ct.lineTo(x,y);
    }
    ct.stroke();
  }
  ct.restore();

  /* piante lontane */
  for(var p=0;p<10;p++){
    var bx=fra(20,L-20,caso(p*5+2));
    var bw=26+caso(p*9)*54, bh=120+caso(p*11)*200;
    ct.fillStyle=rgba(smorza([32,104,74],lucek*0.6),0.55);
    ct.beginPath();
    ct.moveTo(bx,fondo+10);
    ct.quadraticCurveTo(bx-bw+Math.sin(t*0.45+p)*10, A-bh*0.6, bx+Math.sin(t*0.38+p)*16, A-bh);
    ct.quadraticCurveTo(bx+bw+Math.sin(t*0.45+p)*10, A-bh*0.6, bx, fondo+10);
    ct.fill();
  }

  /* ghiaia */
  var gg=ct.createLinearGradient(0,fondo,0,A);
  gg.addColorStop(0,rgba(smorza([92,84,74],lucek),0.95));
  gg.addColorStop(1,rgba(smorza([58,52,46],lucek),1));
  ct.fillStyle=gg;
  ct.beginPath();
  ct.moveTo(0,A); ct.lineTo(0,fondo+10);
  for(var gx=0;gx<=L;gx+=18) ct.lineTo(gx,fondo+10+Math.sin(gx*0.08)*5+caso(gx)*6);
  ct.lineTo(L,A); ct.fill();
  for(var c=0;c<54;c++){
    var px=caso(c*13+1)*L, py=A-caso(c*17+5)*44-5;
    ct.fillStyle=rgba(smorza([176,168,156],lucek),0.18+caso(c*19)*0.3);
    ct.beginPath();
    ct.ellipse(px,py,2.6+caso(c*23)*3.6,2+caso(c*29)*2.4,caso(c*31)*3,0,6.2832);
    ct.fill();
  }

  /* onde del tocco */
  onde=onde.filter(function(o){ o.t+=dt; return o.t<1; });
  onde.forEach(function(o){
    ct.save();
    ct.globalAlpha=(1-o.t)*0.6;
    ct.strokeStyle='rgba(255,255,255,.9)';
    ct.lineWidth=2*(1-o.t)+0.4;
    ct.beginPath(); ct.arc(o.x,o.y,8+o.t*66,0,6.2832); ct.stroke();
    ct.globalAlpha=(1-o.t)*0.3;
    ct.beginPath(); ct.arc(o.x,o.y,4+o.t*34,0,6.2832); ct.stroke();
    ct.restore();
  });

  /* bolle del filtro */
  var filtroAcceso = !!(S&&S.canali&&S.canali[0]&&S.canali[0].acceso);
  if(filtroAcceso && Math.random()<dt*8)
    bolle.push({x:L-26+(Math.random()-0.5)*14, y:fondo-4, r:1.2+Math.random()*2.6, v:32+Math.random()*52});
  bolle=bolle.filter(function(b){ return b.y>A*0.05; });
  ct.strokeStyle='rgba(255,255,255,.42)'; ct.lineWidth=1;
  bolle.forEach(function(b){
    b.y-=b.v*dt; b.x+=Math.sin((t+b.y)*2)*8*dt;
    ct.beginPath(); ct.arc(b.x,b.y,b.r,0,6.2832); ct.stroke();
  });

  /* Velo in alto perche' il titolo si legga sull'acqua chiara. Si esaurisce
     appena sotto la testata: al titolo serve contrasto per una sessantina di
     pixel, non per trecento, e il resto della vasca deve restare luminoso. */
  var finVelo=A*0.20;
  var velo=ct.createLinearGradient(0,0,0,finVelo);
  velo.addColorStop(0,'rgba(4,12,14,.55)');
  velo.addColorStop(0.45,'rgba(4,12,14,.24)');
  velo.addColorStop(1,'rgba(4,12,14,0)');
  ct.fillStyle=velo; ct.fillRect(0,0,L,finVelo);

  var vig=ct.createRadialGradient(L/2,A*0.45,L*0.3,L/2,A*0.5,L*0.95);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(2,8,10,.55)');
  ct.fillStyle=vig; ct.fillRect(0,0,L,A);
}

function disegnaDavanti(t,m,lucek){
  var ct=ctF;
  ct.clearRect(0,0,L,A);
  var base=smorza([26,92,62],lucek), punta=smorza([88,168,104],lucek);

  for(var i=0;i<3;i++){
    var bx = i===1 ? L*0.52 : (i===0 ? -12 : L+12);
    var h = A*(0.20+caso(i*3+1)*0.13);
    var on = Math.sin(t*0.45+i*2)*24;
    ct.save(); ct.globalAlpha=0.42; ct.fillStyle=rgba(base,0.95);
    ct.beginPath();
    ct.moveTo(bx-24,A);
    ct.quadraticCurveTo(bx-38+on*0.5,A-h*0.6,bx+on,A-h);
    ct.quadraticCurveTo(bx+32+on*0.5,A-h*0.55,bx+24,A);
    ct.fill(); ct.restore();
  }

  /* L'erba passa davanti ai pannelli: e' l'idea del disegno e funziona. Ma alla
     prima prova a schermo copriva la riga "Luce automatica" al punto da non
     poterla leggere. Il contenuto scorre, quindi qualunque comando puo'
     capitare in fondo: l'erba deve restare un velo, non un sipario. Percio'
     fili piu' bassi e semitrasparenti - si vedono, non nascondono. */
  var fili=30;
  ct.globalAlpha=0.5;
  for(var k=0;k<fili;k++){
    var x=(k/(fili-1))*(L+30)-15+(caso(k*7+3)-0.5)*14;
    var h2=50+caso(k*11+5)*95;
    var w=3+caso(k*13)*4;
    var on2=Math.sin(t*(0.6+caso(k*17)*0.5)+k*0.8)*(7+h2*0.07);
    var gr=ct.createLinearGradient(0,A,0,A-h2);
    gr.addColorStop(0,rgba(base,0.96));
    gr.addColorStop(1,rgba(punta,0.7));
    ct.fillStyle=gr;
    ct.beginPath();
    ct.moveTo(x-w,A);
    ct.quadraticCurveTo(x-w*0.6+on2*0.4,A-h2*0.55,x+on2,A-h2);
    ct.quadraticCurveTo(x+w*0.6+on2*0.4,A-h2*0.5,x+w,A);
    ct.fill();
  }
  ct.globalAlpha=1;
}

/* ===========================================================================
   I COMANDI
   =========================================================================== */
function chiedi(percorso){
  if(REMOTO){
    /* Fuori casa lo stato arriva da solo dal ponte: niente da chiedere. I
       comandi si scrivono nella casella dei comandi, con le stesse parole. */
    if(percorso==='/stato') return;
    if(cliente&&cliente.connected) cliente.publish(PONTE.comandi, percorso.slice(1), {qos:1});
    else segnala('ponte non collegato');
    return;
  }
  if(inAttesa&&percorso==='/stato') return;
  if(percorso==='/stato') inAttesa=true;
  var taglia=new AbortController();
  var scadenza=setTimeout(function(){taglia.abort();},2500);
  var haRisposto=false;
  fetch(percorso,{signal:taglia.signal,cache:'no-store'})
    .then(function(r){ haRisposto=true; if(!r.ok) throw new Error('risposta '+r.status); return r.json(); })
    .then(function(d){
      S=d; modo=d.modo; if(!trascino) intensita=d.intensita;
      viva=true; ultimoContatto=Date.now(); dipingi();
      /* un lavoro appena segnato deve comparire subito nel calendario */
      if(percorso.indexOf('/fatto')===0) chiediStorico();
    })
    .catch(function(){
      if(!haRisposto){ viva=false; }
      else if(percorso.indexOf('/fatto')===0){ segnala("non segnato: la centralina non sa ancora che ora e'"); }
      else if(percorso.indexOf('/giornata')===0){ segnala('orari non accettati dalla centralina'); rimettiOrari(); }
      dipingi();
    })
    .then(function(){ clearTimeout(scadenza); if(percorso==='/stato') inAttesa=false; });
}

/* cursore dell'intensita': mentre si trascina non si manda una richiesta a ogni
   pixel - la centralina ne riceverebbe centinaia e la striscia singhiozzerebbe.
   Si manda al massimo ogni 200 ms, e sempre una volta al rilascio. */
var pista=document.getElementById('pista'), ultimoInvio=0;
function daPosizione(ev){
  var r=pista.firstElementChild.getBoundingClientRect();
  return Math.max(0,Math.min(100,Math.round(((ev.clientX-r.left)/r.width)*100)));
}
function inviaIntensita(forza){
  var ora=Date.now();
  if(!forza && ora-ultimoInvio<200) return;
  ultimoInvio=ora;
  chiedi('/luce?intensita='+intensita);
}
pista.addEventListener('pointerdown',function(e){
  if(!viva) return;
  trascino=true; pista.setPointerCapture(e.pointerId);
  intensita=daPosizione(e); dipingi(); inviaIntensita(true);
});
pista.addEventListener('pointermove',function(e){
  if(!trascino) return;
  intensita=daPosizione(e); dipingi(); inviaIntensita(false);
});
function fineTrascino(){
  if(!trascino) return;
  trascino=false; inviaIntensita(true);
}
pista.addEventListener('pointerup',fineTrascino);
pista.addEventListener('pointercancel',fineTrascino);

/* ===========================================================================
   IL CALENDARIO

   Lo storico si chiede a parte e di rado, non insieme allo stato: lo stato
   cambia ogni due secondi, il calendario cambia quando premi "fatto". Chiederli
   insieme vorrebbe dire trasmettere sessanta eventi ogni due secondi per
   niente.
   =========================================================================== */

var eventi=[];

function chiediStorico(){
  if(REMOTO) return;   /* fuori casa arriva da solo dal ponte */
  var taglia=new AbortController();
  var scadenza=setTimeout(function(){taglia.abort();},3000);
  fetch('/storico',{signal:taglia.signal,cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('no'); return r.json(); })
    .then(function(d){ eventi=d.eventi||[]; dipingiCalendario(); })
    .catch(function(){})
    .then(function(){ clearTimeout(scadenza); });
}

var MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno',
          'luglio','agosto','settembre','ottobre','novembre','dicembre'];

/* "oggi" e "ieri" invece della data: a due giorni di distanza una data va
   decifrata, una parola no. Piu' indietro la data serve davvero, e l'anno
   compare solo quando non e' quello in corso. */
function dataItaliana(secondi){
  var d=new Date(secondi*1000), ora=new Date();
  var a=new Date(ora.getFullYear(),ora.getMonth(),ora.getDate());
  var b=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var giorni=Math.round((a-b)/86400000);
  if(giorni===0) return 'oggi';
  if(giorni===1) return 'ieri';
  var testo=d.getDate()+' '+MESI[d.getMonth()];
  if(d.getFullYear()!==ora.getFullYear()) testo+=' '+d.getFullYear();
  return testo;
}

function dipingiCalendario(){
  var c=document.getElementById('calendario');
  c.innerHTML='';
  if(!eventi.length){
    var v=document.createElement('span');
    v.className='vuoto';
    v.textContent='niente di segnato: premi "fatto" quando fai un lavoro';
    c.appendChild(v);
    return;
  }
  /* Si mostrano i piu' recenti. Sessanta righe in un pannello non si leggono, e
     quello che interessa e' sempre l'ultimo tratto. */
  eventi.slice(0,12).forEach(function(e){
    var r=document.createElement('div');
    r.className='voce';
    var misura='';
    if(typeof e.valore==='number')
      misura='<span class="misura">'+String(e.valore).replace('.',',')+(e.unita?' '+e.unita:'')+'</span>';
    r.innerHTML='<span class="giorno">'+dataItaliana(e.quando)+'</span>'+
                '<span class="cosa">'+e.etichetta+'</span>'+misura;
    c.appendChild(r);
  });
}

/* ===========================================================================
   COSA SI VEDE
   =========================================================================== */
var MIN=14, MAX=32, BUONA_DA=18, BUONA_A=24;
document.getElementById('fascia').style.left =((BUONA_DA-MIN)/(MAX-MIN)*100)+'%';
document.getElementById('fascia').style.right=((MAX-BUONA_A)/(MAX-MIN)*100)+'%';

/* Il massimo di ossigeno che l'acqua dolce puo' contenere a questa temperatura.
   Non e' l'ossigeno che c'e' davvero - per quello serve una sonda da 250 euro -
   e' il tetto: piu' l'acqua e' calda, meno ne tiene. Curva ricavata dalla
   tabella standard APHA, scarto massimo 0,005 mg/L. */
function ossigenoMax(T){
  return 14.618882 + T*(-0.41093224 + T*(0.0090059214 + T*(-0.00013158322 + T*0.00000088341014)));
}

function daQuanto(g){
  if(g<0) return 'mai';
  if(g===0) return 'oggi';
  if(g===1) return 'ieri';
  if(g<14) return g+' giorni fa';
  if(g<60) return Math.round(g/7)+' settimane fa';
  var m=Math.round(g/30);
  return m<=1 ? 'un mese fa' : m+' mesi fa';
}

function lavoro(dove,dati,orologioCe){
  var e=document.getElementById(dove);
  if(!dati||!viva){ e.innerHTML='&mdash;&mdash;'; e.className='quando'; return; }
  if(!orologioCe){ e.textContent="in attesa dell'ora"; e.className='quando'; return; }
  if(!dati.quando){ e.textContent='mai'; e.className='quando ora'; return; }
  e.textContent=daQuanto(dati.giorni);
  e.className='quando'+((dati.giorni>=dati.ogni)?' ora':'');
}

var contGiornata=document.getElementById('giornata');

/* Le cinque righe della giornata si costruiscono UNA volta. Prima si
   ricostruivano quando cambiavano gli orari: con i campi modificabili avrebbe
   voluto dire distruggere la rotella dell'orario mentre la si sta girando,
   appena arriva lo stato successivo. */
var campiOra={};
ORDINE.forEach(function(k){
  var Mk=MODI[k];
  var riga=document.createElement('div');
  riga.className='tappa'; riga.setAttribute('data-modo',k);
  riga.style.marginBottom='8px';
  riga.innerHTML='<span class="bollo" style="background:'+Mk.bollo+'"></span>'+
                 '<span class="nome">'+Mk.nome+'</span>';
  var campo=document.createElement('input');
  campo.type='time'; campo.className='ora-tappa'; campo.disabled=true;
  campo.addEventListener('change',inviaGiornata);
  riga.appendChild(campo);
  contGiornata.appendChild(riga);
  campiOra[k]=campo;
});

function minutiDi(testo){
  var p=(testo||'').split(':');
  return p.length===2 ? parseInt(p[0],10)*60+parseInt(p[1],10) : NaN;
}

/* Il controllo dell'ordine si fa qui E sulla centralina. Qui per rispondere
   subito e rimettere l'orario com'era; la' perche' e' l'unico controllo che
   conta davvero - la centralina non deve fidarsi di chi le scrive. */
function inviaGiornata(){
  var prec=-1, ok=true, parti=[];
  ORDINE.forEach(function(k){
    var v=campiOra[k].value, m=minutiDi(v);
    if(isNaN(m) || m<=prec) ok=false;
    prec=m;
    parti.push(k+'='+encodeURIComponent(v));
  });
  if(!ok){
    segnala('gli orari devono essere in ordine: alba, giorno, tramonto, luna, spento');
    rimettiOrari();
    return;
  }
  chiedi('/giornata?'+parti.join('&'));
}

function rimettiOrari(){
  var g=(S&&S.giornata)?S.giornata:[];
  g.forEach(function(x){ if(campiOra[x.modo]) campiOra[x.modo].value=x.ora; });
}

document.getElementById('ripristinaGiornata').onclick=function(){
  if(!viva) return;
  chiedi('/giornata?ripristina=1');
};

function dipingi(){
  var M=MODI[modo]||MODI.giorno;
  var acc=daEsa(M.accento);

  /* il modo colora tutta l'app, non solo l'acqua: tre variabili e cambia tutto */
  var r=document.documentElement.style;
  r.setProperty('--accento',M.accento);
  r.setProperty('--accento-rgb',acc.join(','));
  r.setProperty('--vetro','linear-gradient(165deg,rgba('+acc.join(',')+',.13),rgba(4,12,14,.34))');
  r.setProperty('--bordo','rgba('+acc.join(',')+',.28)');

  document.getElementById('pallino').style.background=M.bollo;
  document.getElementById('pallino').style.boxShadow='0 0 12px '+M.bollo;
  document.getElementById('modoNome').textContent=M.nome.toUpperCase();

  var pil=document.getElementById('pillola');
  pil.className = viva ? '' : 'morta';
  pil.textContent = viva ? 'CONNESSO' : 'NON RISPONDE';

  /* temperatura */
  var t=(S&&typeof S.temperatura==='number')?S.temperatura:null;
  var gradi=document.getElementById('gradi'), spillo=document.getElementById('spillo');
  var nota=document.getElementById('notaTemp');
  if(t===null||!viva){
    gradi.innerHTML='&mdash;&mdash;';
    spillo.style.left='50%'; spillo.style.background='rgba(188,212,212,.35)';
    nota.textContent = viva ? 'sonda non collegata' : 'sonda non raggiungibile';
  }else{
    gradi.textContent=t.toFixed(1).replace('.',',');
    var q=Math.max(0,Math.min(1,(t-MIN)/(MAX-MIN)));
    spillo.style.left=(q*100)+'%';
    var dentro=(t>=BUONA_DA&&t<=BUONA_A);
    spillo.style.background = dentro ? '#bcd4d4' : '#FFA06B';
    /* innerHTML e non textContent: il puntino di mezzo e' scritto come entita'
       HTML (il file deve restare in solo ASCII) e textContent lo mostrerebbe
       alla lettera, "&middot;", invece del segno. */
    nota.innerHTML=(dentro?'fascia buona 18-24':(t>BUONA_A?'sopra la fascia 18-24':'sotto la fascia 18-24'))
      +' &middot; ossigeno max '+ossigenoMax(t).toFixed(1).replace('.',',')+' mg/L';
  }

  /* filtro */
  var acceso=!!(S&&S.canali&&S.canali[0]&&S.canali[0].acceso);
  document.getElementById('valFiltro').innerHTML=(S&&viva)?(acceso?'ON':'OFF'):'&mdash;&mdash;';
  levaFiltro.className='leva'+((acceso&&viva)?' on':'');
  levaFiltro.disabled=!(S&&viva);

  /* modi */
  Array.prototype.forEach.call(contModi.children,function(b){
    var k=b.getAttribute('data-modo'), Mk=MODI[k], attivo=(k===modo);
    var a=daEsa(Mk.accento);
    b.style.background = attivo ? 'rgba('+a.join(',')+',.16)' : 'rgba(255,255,255,.05)';
    b.style.borderColor = attivo ? Mk.accento : 'rgba(255,255,255,.1)';
    b.style.color = attivo ? Mk.accento : 'rgba(240,250,250,.85)';
    b.firstElementChild.style.boxShadow = attivo ? '0 0 16px '+Mk.bollo : 'none';
  });

  /* intensita' */
  document.getElementById('valIntensita').textContent = viva ? intensita+'%' : '--';
  document.getElementById('riempi').style.width=intensita+'%';
  document.getElementById('manopola').style.left=intensita+'%';

  /* luce automatica: l'etichetta dice cosa succede DOPO, non che e' accesa */
  var au=!!(S&&S.automatico);
  var vAuto=document.getElementById('valAuto');
  if(!(S&&viva))          vAuto.innerHTML='&mdash;&mdash;';
  else if(!au)            vAuto.textContent='A MANO';
  else if(!S.prossimo)    vAuto.textContent='SENZA ORA';
  else                    vAuto.textContent=(S.prossimo.modo+' '+S.prossimo.ora).toUpperCase();
  tastoAuto.className='comando'+((au&&S&&S.prossimo&&viva)?' acceso':'');
  tastoAuto.disabled=!(S&&viva);

  /* manutenzione */
  var man=S?S.manutenzione:null;
  var oraCe=!!(man&&man.orologio);
  lavoro('quandoAcqua',  man?man.acqua :null, oraCe);
  lavoro('quandoFiltro', man?man.filtro:null, oraCe);

  /* giornata, presa dalla centralina. Il campo che si sta toccando non si
     sovrascrive: lo stato arriva ogni due secondi e riporterebbe l'orario
     vecchio sotto il dito. */
  var g=(S&&S.giornata)?S.giornata:[];
  g.forEach(function(x){
    var c=campiOra[x.modo]; if(!c) return;
    if(document.activeElement!==c) c.value=x.ora;
    c.disabled=!viva;
  });
  if(!g.length) ORDINE.forEach(function(k){ campiOra[k].disabled=true; });
  Array.prototype.forEach.call(contGiornata.children,function(d){
    d.className='tappa'+((d.getAttribute('data-modo')===modo)?' adesso':'');
  });
}

function orologio(){
  var pie=document.getElementById('pie');
  if(avviso&&Date.now()<scadenzaAvviso){ pie.textContent=avviso; return; }
  if(REMOTO) aggiornaVita();
  if(!viva){
    pie.textContent = (REMOTO && !(cliente&&cliente.connected)) ? 'ponte non collegato' : 'la centralina non risponde';
    return;
  }
  var s=Math.max(0,Math.round((Date.now()-ultimoContatto)/1000));
  pie.textContent=(REMOTO?'da fuori casa, ':'')+'aggiornato '+(s<2?'adesso':s+' secondi fa');
}

window.addEventListener('resize',misura);
misura();
dipingi();
requestAnimationFrame(fotogramma);
chiedi('/stato');
chiediStorico();
if(REMOTO) collegaPonte();
setInterval(function(){ chiedi('/stato'); },2000);
/* Ogni cinque minuti si riprende lo storico: non per vedere i propri comandi,
   che arrivano gia' subito, ma per accorgersi di un "fatto" premuto da un altro
   telefono - o dallo stesso, aperto in un'altra scheda. */
setInterval(chiediStorico,300000);
setInterval(orologio,1000);
</script>
